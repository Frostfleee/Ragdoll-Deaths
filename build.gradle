plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// This root build makes the Fabric and Quilt jars; neoforge/ and forge/ are separate builds over the same sources.
// Shared code is src/main. Version-specific code lives in src/<compat>/java (Compat and the mixins whose targets
// moved): 26.1.x uses mc26_1, and 26.2 and later share mc26_2. -Ploader=quilt swaps fabric.mod.json for quilt.mod.json.
def compat = project.findProperty('compat') ?: 'mc26_2'
def loader = project.findProperty('loader') ?: 'fabric'

sourceSets {
	main {
		java {
			srcDir "src/${compat}/java"
			srcDir 'src/fabric/java'
			srcDir "src/fabric_${compat}/java"
		}
		resources {
			srcDir "src/${loader}/resources"
		}
	}
}

// ./gradlew runClientGameTest -PvisualTests opens a fresh test world, stages deaths from src/gametest and saves
// screenshots under build/run/clientGameTest/screenshots. Development only: nothing from it ships in the jar.
if (project.hasProperty('visualTests')) {
	fabricApi {
		configureTests {
			createSourceSet = true
			modId = 'ragdolldeaths-visual-tests'
			enableGameTests = false
			enableClientGameTests = true
			eula = true
		}
	}
	// The visual test's frame capture differs between game versions.
	sourceSets.gametest.java.srcDir "src/gametest_${compat}/java"
}

version = "${project.mod_version}+${project.minecraft_range_name}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	maven {
		name = 'Quilt'
		url = 'https://maven.quiltmc.org/repository/release/'
		content {
			includeGroup 'org.quiltmc'
		}
	}
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
		content {
			includeGroup 'com.terraformersmc'
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	if (loader == 'quilt' && project.hasProperty('quiltRun')) {
		// -PquiltRun: runClient starts the game on the Quilt loader itself, which also provides Fabric's loader API.
		implementation "org.quiltmc:quilt-loader:${project.findProperty('quilt_loader_version') ?: '0.30.2'}"
		// what Quilt's launcher manifest (quilt-loader-<version>.json) lists; its Maven metadata names none of it
		implementation 'net.fabricmc:sponge-mixin:0.17.4+mixin.0.8.7'
		implementation 'io.github.llamalad7:mixinextras-fabric:0.5.5'
		implementation 'org.quiltmc:quilt-json5:1.0.4+final'
		implementation 'org.quiltmc:quilt-config:1.3.3'
	} else {
		implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	}
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	compileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") {
		transitive = false
	}
	localRuntime("com.terraformersmc:modmenu:${project.modmenu_version}") {
		transitive = false
	}

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	def version = project.version
	def minecraftRange = project.minecraft_range
	inputs.property "version", version
	inputs.property "minecraftRange", minecraftRange
	// Gradle does not see edits to the filters below: bump this when changing them, so the resources are rebuilt.
	inputs.property "filterRevision", 2

	// Quilt reads ">=26.2 <26.4" as one bound; it takes the two bounds as {"all": [">=26.2", "<26.4"]}.
	def quiltMinecraftRange = '{ "all": [' + minecraftRange.split(' ').collect { '"' + it + '"' }.join(', ') + '] }'
	filesMatching(["fabric.mod.json", "quilt.mod.json"]) {
		expand "version": version, "minecraftRange": minecraftRange, "quiltMinecraftRange": quiltMinecraftRange
		// Quilt assumes its own hashed names unless told the mod uses Fabric's (on 26.x, which needs none, as well).
		filter { it.replace('"group": "com.frostfleee",', '"group": "com.frostfleee", "intermediate_mappings": "net.fabricmc:intermediary",') }
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform()
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

// -Pselftest makes ./gradlew runClient create a world, kill some mobs and the player, log SELFTEST lines and quit
// (see SelfTest).
loom {
	runs {
		client {
			if (project.hasProperty('selftest')) {
				vmArg '-Dragdolldeaths.selftest=true'
			}
			if (project.hasProperty('quiltRun')) {
				// Quilt reads its own names for Loom's development flags; without them it loads no mods from the classpath.
				vmArg '-Dloader.development=true'
				vmArg '-Dloader.disable_forked_guis=true' // a crash ends the run instead of waiting in a window
				vmArg "-Dloader.remapClasspathFile=${file('.gradle/loom-cache/remapClasspath.txt')}"
			}
		}
	}
}
