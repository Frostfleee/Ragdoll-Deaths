modLoader = "javafml"
loaderVersion = "${forgeRange}"
license = "MIT"
clientSideOnly = true

[[mods]]
modId = "ragdolldeaths"
version = "${version}"
displayName = "Ragdoll Deaths"
authors = "Frostfleee"
logoFile = "assets/ragdolldeaths/icon.png"
displayTest = "IGNORE_ALL_VERSION"
description = '''
Dead mobs become real physics ragdolls, thrown by the blow that killed them: they tumble down stairs, slump against walls, float in water and burn where lava touched them. Client-side and purely visual.
'''

[[dependencies.ragdolldeaths]]
modId = "forge"
mandatory = true
versionRange = "${forgeRange}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.ragdolldeaths]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraftRange}"
ordering = "NONE"
side = "CLIENT"
